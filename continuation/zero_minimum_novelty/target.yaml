target_id: chores-efx-single-minimum-zero-normalization
search_date: 2026-10-07
intended_contribution_unit: proof-and-computational-reduction
claim:
  exact_statement: |
    For every finite nonnegative additive chore instance C, choose one
    globally minimum-cost chore e_i in each row. Let D equal C except that
    D_i(e_i)=0. Under complete EFX with every owned chore in the deletion
    quantifier, including zero-cost chores, EFX(D) is a subset of EFX(C).
    Consequently counterexamples are preserved. For three agents and m>=4,
    a counterexample has a representative with one zero per row and all
    other costs positive integers at most floor(sqrt((m-2)*(m-1)^(m-2))).
    At m=9 the bound is3831. Raising the zero entries to1/2 and multiplying
    by2 gives a positive integer counterexample with all row minima exactly1
    and every other entry even in2..7662. No such counterexample is asserted.
  exclusions:
    - This is not a nine-chore existence proof or a counterexample.
    - It does not subtract a row minimum from every coordinate.
    - It does not assert equality of the two EFX allocation sets.
    - It does not apply a positive-only-deletion definition after zeroing.
    - No historical-priority or first-proof claim is made.
