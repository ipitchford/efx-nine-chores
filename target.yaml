target_id: three-agent-nine-chore-efx
search_date: 2026-10-07
intended_contribution_unit: theorem
claim:
  exact_statement: |
    For every matrix C in R_{≥0}^{3 x 9}, there is a labelled partition
    (A_0,A_1,A_2) of {0,...,8} such that for all i != j and every g in A_i,
    sum_{h in A_i except g} C[i,h] <= sum_{h in A_j} C[i,h].
    Empty bundles are allowed, and zero-cost owned chores remain quantified.
    Alternatively, refute this statement by an exact rational counterexample
    and an exhaustive verifier of all 3^9 labelled allocations.
  exclusions:
    - Approximate EFX, EF1, tEFX, disposal, partial allocations, positive-only trim conventions.
    - Restricted costs or bounded integer search as a universal proof.
    - Solver timeout or numerical infeasibility as a proof.
source:
  originating_reference: Xinkai Zhang (2026), EFX Allocations for Three Agents and Seven or Eight Chores, version 2, 6 October 2026.
  url: https://arxiv.org/html/2609.10585v2
normalisation:
  indices: agents 0,1,2; chores 0,...,8
  scaling: positive independent row scaling preserves all EFX comparisons; zero rows handled separately
  basis_order: labelled item columns, simultaneous column permutations only
  symmetries: [agent permutations with rows and allocated labels together, simultaneous chore permutations, positive row scaling]
